name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 本项目 test/check 均为 node 原生命令、无外部依赖，无需 npm install
      - name: 单元测试
        run: npm test
      - name: 语法检查
        run: npm run check
